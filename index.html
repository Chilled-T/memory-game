<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game with Audio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0f172a;
            overflow: hidden; /* Prevent scrolling */
        }

        /* --- Animated Background --- */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(132deg, #0f172a, #1e1b4b, #312e81);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Floating particles */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* --- Card Flip 3D Logic --- */
        .card-container {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* Card Back (Default state) */
        .card-front {
            background-color: #1e293b;
            color: #94a3b8;
            border: 2px solid #334155;
        }

        /* Card Face (Revealed state) */
        .card-back {
            background-color: #312e81; /* Indigo-900 */
            color: white;
            transform: rotateY(180deg);
            border: 2px solid #6366f1; /* Indigo-500 */
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); /* Glow effect */
        }

        /* Hover effect for unflipped cards */
        .card-container:not(.flipped):hover .card-inner {
            transform: scale(1.05);
        }

        /* Matched Animation */
        .card-container.matched .card-inner .card-back {
            background-color: #064e3b; /* Emerald-900 */
            border-color: #34d399; /* Emerald-400 */
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.8);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.05); }
            100% { transform: rotateY(180deg) scale(1); }
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col">

    <div class="animated-bg" id="bg-animation"></div>

    <header class="p-6 text-center z-10">
        <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 drop-shadow-lg">
            MEMORY GAME
        </h1>
        <div class="mt-4 flex justify-center gap-8 text-sm md:text-base text-cyan-300">
            <p>Moves: <span id="moves" class="font-bold text-white">0</span></p>
            <p>Time: <span id="time" class="font-bold text-white">00:00</span></p>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 z-10">
        <div id="game-board" class="grid grid-cols-4 gap-4 w-full max-w-lg aspect-square">
            </div>
    </main>

    <footer class="p-4 text-center text-xs text-white z-10 border-t border-slate-800 bg-black">
        Developed by <span class="text-cyan-400 font-bold"><a href="http://www.tumelotsie.online/">Tumelo Tsie</a></span>
    </footer>

    <div id="overlay" class="fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <h2 id="overlay-title" class="text-5xl md:text-7xl font-bold text-white mb-8 animate-pulse text-center">
            READY?
        </h2>
        <p id="overlay-msg" class="text-slate-400 mb-8 text-center hidden">You won in <span id="final-moves">0</span> moves!</p>
        
        <button id="start-btn" class="group relative px-8 py-4 bg-transparent overflow-hidden rounded-full cursor-pointer">
            <span class="absolute inset-0 w-full h-full bg-gradient-to-br from-purple-600 to-blue-500 group-hover:from-purple-600 group-hover:to-blue-600 transition-all duration-300 ease-out transform group-hover:scale-105 opacity-80 group-hover:opacity-100"></span>
            <span class="relative text-xl font-bold tracking-wider">PRESS START</span>
        </button>
    </div>

    <script>
        // --- Game Configuration ---
        const ICONS = [
            '👻', '👽', '👾', '🤖', 
            '⚡', '🔥', '💎', '🧬'
        ];

        class MemoryGame {
            constructor() {
                this.gameBoard = document.getElementById('game-board');
                this.overlay = document.getElementById('overlay');
                this.titleElement = document.getElementById('overlay-title');
                this.msgElement = document.getElementById('overlay-msg');
                this.startBtn = document.getElementById('start-btn');
                this.movesElement = document.getElementById('moves');
                this.timeElement = document.getElementById('time');
                this.finalMovesElement = document.getElementById('final-moves');

                this.cards = [];
                this.flippedCards = [];
                this.matchedPairs = 0;
                this.moves = 0;
                this.timerInterval = null;
                this.seconds = 0;
                this.isLocked = false; 

                // --- Audio Objects ---
                this.soundStart = new Audio('game-start.mp3');
                this.soundWin = new Audio('game-win.mp3');
                this.soundBg = new Audio('Density_and_Time-MAZE_NO_COPYRIGHT_8-bit_Music.mp3');
                
                // Configure Background Music Loop
                this.soundBg.loop = true;
                this.soundBg.volume = 0.5; // Set volume to 50% so it's not too loud

                this.initBackground();
                
                this.startBtn.addEventListener('click', () => this.startGame());
            }

            initBackground() {
                const bg = document.getElementById('bg-animation');
                for(let i=0; i<20; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    particle.style.width = Math.random() * 10 + 2 + 'px';
                    particle.style.height = particle.style.width;
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = Math.random() * 100 + '%';
                    particle.style.animationDuration = Math.random() * 20 + 10 + 's';
                    particle.style.animationDelay = Math.random() * 5 + 's';
                    bg.appendChild(particle);
                }
            }

            startGame() {
                // Play Start Sound
                this.soundStart.play().catch(e => console.log("Audio play blocked:", e));
                
                // Start Background Music (Reset to 0)
                this.soundBg.currentTime = 0;
                this.soundBg.play().catch(e => console.log("Audio play blocked:", e));

                // Hide overlay
                this.overlay.classList.add('opacity-0', 'pointer-events-none');
                
                // Reset state
                this.cards = [...ICONS, ...ICONS]; 
                this.shuffleCards();
                this.renderBoard();
                this.matchedPairs = 0;
                this.moves = 0;
                this.seconds = 0;
                this.movesElement.innerText = '0';
                this.timeElement.innerText = '00:00';
                this.isLocked = false;
                this.flippedCards = [];

                // Start Timer
                clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    this.seconds++;
                    const mins = Math.floor(this.seconds / 60).toString().padStart(2, '0');
                    const secs = (this.seconds % 60).toString().padStart(2, '0');
                    this.timeElement.innerText = `${mins}:${secs}`;
                }, 1000);
            }

            shuffleCards() {
                for (let i = this.cards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.cards[i], this.cards[j]] = [this.cards[j], this.cards[i]];
                }
            }

            renderBoard() {
                this.gameBoard.innerHTML = '';
                this.cards.forEach((icon, index) => {
                    const card = document.createElement('div');
                    card.classList.add('card-container', 'h-20', 'md:h-24', 'w-full');
                    card.dataset.icon = icon;
                    card.dataset.index = index;

                    const inner = document.createElement('div');
                    inner.classList.add('card-inner');

                    const front = document.createElement('div');
                    front.classList.add('card-front');
                    front.innerHTML = '<span class="text-2xl text-slate-600">?</span>';

                    const back = document.createElement('div');
                    back.classList.add('card-back');
                    back.innerHTML = `<span class="text-4xl">${icon}</span>`;

                    inner.appendChild(front);
                    inner.appendChild(back);
                    card.appendChild(inner);

                    card.addEventListener('click', () => this.flipCard(card));
                    this.gameBoard.appendChild(card);
                });
            }

            flipCard(card) {
                if (this.isLocked) return;
                if (card.classList.contains('flipped')) return;
                if (card.classList.contains('matched')) return;

                card.classList.add('flipped');
                this.flippedCards.push(card);

                if (this.flippedCards.length === 2) {
                    this.incrementMoves();
                    this.checkForMatch();
                }
            }

            incrementMoves() {
                this.moves++;
                this.movesElement.innerText = this.moves;
            }

            checkForMatch() {
                this.isLocked = true;
                const [card1, card2] = this.flippedCards;
                const isMatch = card1.dataset.icon === card2.dataset.icon;

                if (isMatch) {
                    this.handleMatch(card1, card2);
                } else {
                    this.handleMismatch(card1, card2);
                }
            }

            handleMatch(card1, card2) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    this.flippedCards = [];
                    this.isLocked = false;
                    this.matchedPairs++;

                    if (this.matchedPairs === ICONS.length) {
                        this.gameOver();
                    }
                }, 500);
            }

            handleMismatch(card1, card2) {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    this.flippedCards = [];
                    this.isLocked = false;
                }, 1000);
            }

            gameOver() {
                clearInterval(this.timerInterval);
                
                // Stop Background Music and Play Win Sound
                this.soundBg.pause();
                this.soundWin.play().catch(e => console.log("Audio play blocked:", e));

                setTimeout(() => {
                    this.titleElement.innerText = "YOU WIN!";
                    this.msgElement.classList.remove('hidden');
                    this.finalMovesElement.innerText = this.moves;
                    this.startBtn.querySelector('span:last-child').innerText = "PLAY AGAIN";
                    
                    this.overlay.classList.remove('opacity-0', 'pointer-events-none');
                }, 800);
            }
        }

        const game = new MemoryGame();
    </script>
</body>

</html>
